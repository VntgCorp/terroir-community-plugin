name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 구조 — 분류 · 깊이 · 이름 · 매니페스트 · 필수 파일 · 스킬
      - name: 구조 검사
        run: node .github/scripts/check-structure.mjs

      # 목록이 실제 디렉토리와 맞는지. 정렬·들여쓰기는 보지 않는다
      - name: marketplace.json 검사
        run: node .github/scripts/check-marketplace.mjs

      # 소유 집행은 GitHub 이 한다. 여기선 줄이 빠지지 않았는지만 본다
      - name: CODEOWNERS 검사
        run: node .github/scripts/check-codeowners.mjs

      - name: 버전 증가 검사
        if: github.event_name == 'pull_request'
        run: node .github/scripts/check-version-bump.mjs "${{ github.event.pull_request.base.sha }}"

      # 스키마 정본은 공식 CLI 다. 플랫폼이 바뀌면 여기가 먼저 알려 준다
      - name: claude plugin validate
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .

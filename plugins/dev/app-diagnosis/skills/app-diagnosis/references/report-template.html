<title>앱 이관 현황 진단 : V.Together</title>
<!--
  app-diagnosis 리포트 틀
  이 파일 하나에 조사 안내 · 판단 규칙 · 리포트 디자인이 들어 있다. 진단하는 AI 는 이 주석부터 읽고 따른다.

  ■ 목적
    이 앱이 Terroir 로 들어올 수 있는지, 들어온다면 BYOR 과 greenfield 중 어느 경로인지 가린다.
    그 판단에 필요한 기술 스택 · 아키텍처 · 앱 구조 · 도커라이징 · 배포 파이프라인을 중심으로 조사한다.

  ■ 조사 순서
    1. 소스가 git 저장소인지 먼저 본다. Apps Script 편집기 · 노코드 도구 · 로컬 폴더뿐이면 그 사실을 적고 기능 위주로 진단한다
    2. 파일로 확인한다. 볼 곳: 패키지 매니페스트 · Dockerfile · CI 설정(.github/workflows 등) · 배포 스크립트 · .env.example · 설정 파일
    3. 코드로 알 수 없는 것만 사용자에게 한 번에, 쉬운 말로 묻는다.
       사용자 수 · 사무실 밖이나 휴대폰 사용 · 트래픽을 볼 수 있는 화면 · 외부 서비스의 소유 계정. 모른다고 하면 「알 수 없음」 으로 둔다
    4. 아래 판단 규칙으로 경로를 정하고 리포트를 만든다
    5. 보내기 전에 점검한다: 비밀값이 없다 · 「알 수 없음」 마다 물어볼 사람이 있다 · 경로가 판단 규칙과 맞다

  ■ 사전 체크 (precheck) · 진단을 실행한 사람 기준
    project   앱 이름 · 한 줄 설명 · 소스 위치
    runner    GitHub 계정 이름
    org       GitHub VntgCorp 조직 소속 여부
    plugins   이 Claude 에 설치된 Terroir 플러그인 이름과 버전. 없으면 「없음」
    docker    됨 · 가능 · 어려움 중 하나와 한 줄 근거. 4절의 결론과 같다

  ■ 판단 규칙 (path)
    근거 네 가지를 충족 · 주의 · 미충족 · 알 수 없음 중 하나로 정한다.
      소스 위치      조직 git 저장소 충족 · 개인 계정이나 외부 git 주의 · git 없음 미충족
      컨테이너 실행   모든 앱에 Dockerfile 충족 · 없지만 만들 수 있음 주의 · 만들기 어려움 미충족
      앱 형태        서버 · 정적 화면 · 예약 작업으로 나뉘어 실행 충족 · 여러 앱이 섞여 나눠야 함 주의 · 서버 형태가 아님 미충족
      플랫폼 종속     일반 런타임에서 돈다 충족 · 실행은 독립이지만 외부 서비스에 기댄다 주의 · 특정 서비스 안에서만 돈다 미충족
    경로는 위에서부터 처음 맞는 것으로 정한다.
      1. 소스 위치 · 컨테이너 실행 · 플랫폼 종속 중 미충족이 있으면 greenfield
      2. 앱 형태가 미충족이면 확인 필요
      3. 소스 위치나 컨테이너 실행이 알 수 없음이면 확인 필요
      4. 나머지는 BYOR
    BYOR 은 기존 저장소에 표준 파일을 얹어 옮기는 것, greenfield 는 새 저장소에 기능을 다시 옮겨 담는 것이다.
    Terroir 에서 무엇으로 바꿀지는 제안하지 않는다. 지금 상태만 적는다.

  ■ 먼저 볼 신호 (signals)
    코드에서 확인한 걸림돌을 사실로만 적는다. 예: 헬스체크 주소 없음 · 수동 배포 · 서버가 multipart 로 받는 업로드

  ■ 절 (sections) · 번호와 제목을 그대로 쓴다
    1 기술 스택         언어 · 프레임워크 · 런타임 · 패키지 관리 · 주요 라이브러리 · 테스트와 린트
    2 아키텍처          화면 · 서버 · DB · 외부 서비스 연결 그림(diagram) · 서버 로직이 도는 곳 · DB 종류와 스키마 위치
    3 앱 구조와 실행 형태  저장소 구조 · 빌드와 시작 명령 · 포트 · 상태를 두는 곳 · 파일 업로드 방식 · 예약 작업
                       · 로그인 없이 200 을 돌려주는 헬스체크 주소
    4 도커라이징         verdict 는 됨 · 가능 · 어려움. 배포 단위 앱 개수를 먼저 적고, 앱마다 경로 · 역할 · Dockerfile 유무 ·
                       없으면 만들 수 있는지와 근거를 표로 적는다. Dockerfile 내용은 보지 않는다.
                       모든 앱에 있으면 됨, 없는 앱이 있지만 모두 만들 수 있으면 가능, 하나라도 어려우면 어려움
    5 배포 파이프라인     verdict 는 자동 · 수동 · 없음. CI 설정 위치나 배포 명령 · 이미지 저장 위치 · 비밀값 주입 방식 · 환경별 배포 대상
    6 외부 리소스        리소스마다 이름 · 용도 · 식별 정보 · 설정 위치 · 소유 계정. 개인 계정에 묶인 것은 표시한다
    7 운영 현황          개발과 운영의 DB 공유 · 마이그레이션 적용 방법 · 사용자 규모 · 트래픽이나 볼 수 있는 화면 · 서버 사양
    8 주소와 저장소      현재 URL · 그 URL 이 등록된 곳 · 저장소 소유와 공개 여부 · 커밋하지 않은 변경

  ■ 알 수 없음 (unknowns)
    묶음 · 항목 · 누구에게 물을지. count 는 항목 수

  ■ 채우는 법
    1. 맨 아래 id 가 report 인 JSON 스크립트 칸 안의 JSON 만 바꾼다. 칸 이름은 지금 들어 있는 V.Together 예시와 같게 쓰고 sample 칸은 지운다
    2. 위 <title> 의 앱 이름을 바꾼다
    3. JSON 문자열 안에 꺾쇠와 빗금이 붙은 닫는 태그 모양이 나오면 빗금 앞에 역빗금을 넣는다. 그대로 두면 JSON 칸이 거기서 닫힌다
    4. 그 밖의 줄은 고치지 않는다
    5. 아티팩트로 게시한다. 아티팩트를 만들 수 없으면 맨 앞에 <!doctype html> 한 줄을 붙여 .html 파일로 저장한다

  ■ 인라인 표기 (JSON 의 모든 글자 칸에서 쓸 수 있다)
    `코드`         코드 글꼴
    [[상태]]        상태 칩. 상태 단어가 곧 표시 글자다
    [[표시|상태]]   표시 글자를 따로 정한 칩. 예: [[root|주의]]
  ■ 상태 단어와 색
    충족 · 됨 · 자동 · 있음 · 소속 · 설치됨  초록
    주의 · 가능 · 수동                       주황
    미충족 · 어려움 · 없음                   빨강
    알 수 없음과 그 밖의 단어                 회색

  이 틀을 고치면 README 의 샘플 아티팩트도 같은 PR 에서 다시 게시한다.
-->

<style>

  --ok:#2E7A4E; --ok-soft:#E1F1E7; --warn:#9A6312; --warn-soft:#FBF0DC; --crit:#B3261E; --crit-soft:#FBE4E1;

    --line:#2A3430; --line-2:#36423D; --accent:#7CC3A0; --accent-ink:#0F1A15; --accent-soft:#1E3329;
    --ok:#7CC79A; --ok-soft:#1B3125; --warn:#E3B062; --warn-soft:#352914; --crit:#F08A80; --crit-soft:#3A1D1A;
    --unk:#A7AEB8; --unk-soft:#262B31;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121715; --surface:#19201D; --surface-2:#1F2824; --ink:#E7ECE9; --ink-2:#C3CCC7; --muted:#8E9A94;
  --line:#2A3430; --line-2:#36423D; --accent:#7CC3A0; --accent-ink:#0F1A15; --accent-soft:#1E3329;
  --ok:#7CC79A; --ok-soft:#1B3125; --warn:#E3B062; --warn-soft:#352914; --crit:#F08A80; --crit-soft:#3A1D1A;
  --unk:#A7AEB8; --unk-soft:#262B31;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;margin:0;padding-inline:16px;padding-block:28px 64px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:28px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
code{font-family:var(--mono);font-size:.86em;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 .3em;word-break:break-all}
.mono{font-family:var(--mono);font-size:.86em}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line-2);padding-bottom:18px}
.eyebrow{display:flex;gap:8px;align-items:center;min-height:20px}
.sample{font-size:11px;letter-spacing:.06em;border:1px dashed var(--muted);color:var(--muted);border-radius:999px;padding:1px 8px}
.top h1{font-size:32px;font-weight:700;letter-spacing:-.01em;margin-top:6px}
.top h1 .pre{font-weight:500;color:var(--muted)}
.top .sub{color:var(--ink-2);margin-top:4px}
.meta{display:grid;grid-template-columns:auto auto;gap:2px 14px;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink-2);font-weight:500;word-break:break-all}

.verdict{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.v-left{padding:24px;background:var(--accent-soft);border-right:1px solid var(--line);display:grid;gap:14px;align-content:start}
.v-label{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.paths{display:grid;gap:6px}
.path{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line-2);border-radius:8px;padding:9px 12px;color:var(--muted);background:var(--surface)}
.path .k{font-weight:600;font-size:15px}
.path .d{font-size:12px;text-align:right}
.path.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.path.on .d{opacity:.85}
.v-note{font-size:13px;color:var(--ink-2)}
.v-right{padding:22px 24px;display:grid;gap:14px;align-content:start}
.v-right h2{font-size:18px}
.v-summary{color:var(--ink-2);max-width:68ch;margin:0}
.reasons{display:grid;border-top:1px solid var(--line)}
.reason{display:grid;grid-template-columns:120px 92px minmax(0,1fr);gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:start}
.reason .n{font-weight:600}
.reason p{margin:0;color:var(--ink-2);font-size:14px}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap;line-height:1.6;vertical-align:baseline}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{color:var(--ok);background:var(--ok-soft)}
.warn{color:var(--warn);background:var(--warn-soft)}
.crit{color:var(--crit);background:var(--crit-soft)}
.unk{color:var(--unk);background:var(--unk-soft)}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;display:grid;gap:12px;align-content:start}

.panel h2 small{font-size:12px;color:var(--muted);font-weight:500}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);border-top:1px solid var(--line)}
.kv > div{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;min-width:0}
.kv .k{color:var(--muted)}
.kv .v{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.kv .detail{flex-basis:100%;font-size:12.5px;color:var(--muted)}
.signals{list-style:none;margin:0;padding:0;display:grid;border-top:1px solid var(--line)}
.signals li{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:start}
.signals small{display:block;color:var(--muted);font-size:12.5px}

.detail-grid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:start}
nav.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:grid;gap:2px;font-size:13.5px}
nav.toc .h{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:6px}
nav.toc a{color:var(--ink-2);text-decoration:none;padding:4px 10px;border-left:2px solid var(--line)}
nav.toc a:hover{border-left-color:var(--accent);color:var(--ink)}
.sections{display:grid;gap:18px;min-width:0}
section.s{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 24px;display:grid;gap:14px;min-width:0}
section.s h2{font-size:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
section.s h2 .no{font-family:var(--mono);font-size:13px;color:var(--muted);font-weight:500}
section.s h3{font-size:14px;color:var(--muted);font-weight:600;letter-spacing:.02em}
section.s p{margin:0;max-width:72ch;color:var(--ink-2)}
section.s ul{margin:0;padding-left:1.1em;display:grid;gap:4px;color:var(--ink-2)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2);letter-spacing:.02em}
tr:last-child td{border-bottom:0}
td.src{color:var(--muted);font-size:12.5px}
.callout{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--ink-2)}
.diagram{overflow-x:auto;background:var(--surface-2);border-radius:8px;padding:12px}

      case "text": return txt("p", null, b.text);
      case "sub": return txt("h3", null, b.text);
      case "note": return txt("div", "callout", b.text);
      case "list": return el("ul", null, (b.items || []).map(function (t) { return txt("li", null, t); }));
      case "kv": {
        var kv = el("div", "kv");
        (b.items || []).forEach(function (x) { kv.append(txt("div", "k", x[0]), el("div", "v", [inline(x[1])])); });
        return kv;
      }
      case "table": {
        var thead = el("thead", null, [el("tr", null, (b.head || []).map(function (h) { return txt("th", null, h); }))]);
        var tbody = el("tbody", null, (b.rows || []).map(function (row) {
          return el("tr", null, row.map(function (cell, i) { return txt("td", i === b.src_col ? "src" : null, cell); }));
        }));
        return el("div", "tbl", [el("table", null, [thead, tbody])]);
      }
      case "diagram": {
        var pre = el("pre", "mermaid"); pre.textContent = b.code || "";
        diagrams.push(pre);
        return el("div", "diagram", [pre]);
      }
      default: return b.text ? txt("p", null, b.text) : null;
    }
  }

  function sections(r) {
    var toc = el("nav", "toc", [txt("div", "h", "상세")]);
    toc.setAttribute("aria-label", "목차");
    var wrap = el("div", "sections");
    (r.sections || []).forEach(function (s, i) {
      var id = "s" + (s.no != null ? s.no : i + 1);
      var h = el("h2", null, [txt("span", "no", String(s.no != null ? s.no : "")), document.createTextNode(s.title || "")]);
      if (s.verdict) h.append(chip(s.verdict, s.verdict));
      var sec = el("section", "s", [h].concat((s.blocks || []).map(block)));
      sec.id = id;
      wrap.append(sec);
      var a = el("a"); a.href = "#" + id; a.textContent = (s.no != null ? s.no + " " : "") + (s.title || "");
      toc.append(a);
    });
    var u = r.unknowns;
    if (u) {
      var h = el("h2", null, [document.createTextNode("알 수 없음 "), txt("span", "no num", (u.count != null ? u.count : (u.rows || []).length) + "건")]);
      var tbl = block({ type: "table", head: ["묶음", "항목", "누구에게"], rows: u.rows || [] });
      var sec = el("section", "s", [h, u.intro ? txt("p", null, u.intro) : null, tbl]);
      sec.id = "unknowns";
      wrap.append(sec);
      var a = el("a"); a.href = "#unknowns"; a.textContent = "알 수 없음 " + (u.count != null ? u.count : (u.rows || []).length) + "건";
      toc.append(a);
    }
    return el("div", "detail-grid", [toc, wrap]);
  }

  function footer(r) {
    return el("footer", "foot", [txt("span", null, (r.note ? r.note + " " : "") + "이관 경로는 1차 의견입니다."), txt("span", "mono", "app-diagnosis 리포트 틀 " + TEMPLATE_VERSION)]);
  }

  function isDark() {
    var t = document.documentElement.getAttribute("data-theme");
    if (t) return t === "dark";
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  // 아티팩트는 mermaid 를 자체로 그린다. 로컬 파일이면 라이브러리를 불러 그리고, 못 불러오면 원문을 그대로 둔다.
  function drawDiagrams() {
    if (!diagrams.length) return;
    function run() {
      try {
        window.mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: isDark() ? "dark" : "neutral" });
        window.mermaid.run({ nodes: diagrams.filter(function (n) { return !n.getAttribute("data-processed"); }) });
      } catch (e) { /* 원문 유지 */ }
    }
    if (window.mermaid) return run();
    var sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js";
    sc.onload = run;
    document.head.append(sc);
  }

  var app = document.getElementById("app");
  var r;
  try { r = JSON.parse(document.getElementById("report").textContent); }
  catch (e) { app.append(txt("p", "empty", "리포트 데이터를 읽지 못했습니다. JSON 형식을 확인하세요: " + e.message)); return; }
  if (r.app) document.title = "앱 이관 현황 진단 : " + r.app;
  app.append(header(r), verdict(r.path), el("div", "two", [precheck(r.precheck), signals(r.signals)]), sections(r), footer(r));
  drawDiagrams();
})();
</script>
